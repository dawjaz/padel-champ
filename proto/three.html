<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
<title>Padel Champ: 3D prototype</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b1630; overflow: hidden; font-family: "Trebuchet MS", sans-serif; color: #fff; }
  #wrap { position: relative; width: 100vw; height: 100vh; max-width: calc(100vh * 9 / 16); margin: 0 auto; }
  canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; }
  #hud { position: absolute; left: 0; right: 0; top: 0; padding: 8px; display: flex; justify-content: space-between; pointer-events: none; font-size: 12px; }
  #score { background: rgba(11,42,91,.85); border: 2px solid #fff3; border-radius: 10px; padding: 4px 10px; font-weight: 800; }
  #fps { background: rgba(0,0,0,.4); border-radius: 8px; padding: 4px 8px; }
  #menu { position: absolute; left: 0; right: 0; bottom: 0; padding: 8px; display: flex; flex-wrap: wrap; gap: 5px; justify-content: center; background: linear-gradient(transparent, rgba(11,22,48,.95) 30%); }
  #menu button { font: 800 11px "Trebuchet MS", sans-serif; border: 0; border-radius: 14px; padding: 7px 10px; background: #fff; color: #0b2a5b; }
  #menu button.hot { background: #ff7a29; color: #fff; }
  #title { position: absolute; left: 0; right: 0; top: 34%; text-align: center; pointer-events: none; opacity: 0; transition: opacity .35s; }
  #title .big { font: 900 34px "Trebuchet MS", sans-serif; color: #ffe066; text-shadow: 0 3px 0 #0b2a5b, 0 0 18px #0b2a5b; letter-spacing: 1px; }
  #title .small { font: 800 14px "Trebuchet MS", sans-serif; color: #fff; text-shadow: 0 2px 0 #0b2a5b; margin-top: 4px; }
  #skip { position: absolute; right: 10px; top: 40px; font: 800 11px "Trebuchet MS", sans-serif; background: rgba(0,0,0,.45); border-radius: 10px; padding: 4px 8px; display: none; }
  .bars::before, .bars::after { content: ""; position: absolute; left: 0; right: 0; height: 9%; background: #000; z-index: 2; }
  .bars::before { top: 0; } .bars::after { bottom: 0; }
</style>
</head>
<body>
  <div id="wrap">
    <canvas id="c"></canvas>
    <div id="hud"><div id="score">3D PROTOTYPE</div><div id="fps"></div></div>
    <div id="title"><div class="big"></div><div class="small"></div></div>
    <div id="skip">TAP TO SKIP</div>
    <div id="menu"></div>
  </div>
  <script type="module" src="../src/proto/three/main.ts"></script>
</body>
</html>
