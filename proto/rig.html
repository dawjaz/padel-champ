<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Padel Champ: character rig prototype</title>
<style>
  body { margin: 0; background: #0b2a5b; color: #fff; font: 600 13px/1.3 "Trebuchet MS", sans-serif; display: flex; flex-direction: column; align-items: center; }
  h1 { font-size: 16px; margin: 10px 0 2px; }
  p.sub { margin: 0 12px 8px; color: #b9c8e6; font-weight: 400; text-align: center; max-width: 360px; }
  canvas { background: #2f6fb7; border-radius: 12px; touch-action: manipulation; }
  .row { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin: 8px 0; max-width: 360px; }
  button { font: 700 12px "Trebuchet MS", sans-serif; border: 2px solid #fff; border-radius: 16px; padding: 7px 11px; background: #fff; color: #0b2a5b; }
  button.on { background: #ff7a29; color: #fff; border-color: #ff7a29; }
  #stats { color: #b9c8e6; font-weight: 400; font-size: 11px; margin-bottom: 14px; }
</style>
</head>
<body>
  <h1>Character rig: now vs rig</h1>
  <p class="sub">Top: how the game animates today (fixed pictures swapped). Bottom: the same character driven by a rig every frame.</p>
  <canvas id="c"></canvas>
  <div class="row" id="clips"></div>
  <div class="row" id="opts"></div>
  <div id="stats"></div>
  <script type="module" src="../src/proto/rig.ts"></script>
</body>
</html>
