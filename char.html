<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#070b1c" />
    <title>Padel Champ - 3D character</title>
    <style>
      html, body { margin: 0; height: 100%; background: #05070f; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; font-family: system-ui, sans-serif; }
      #frame { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
      #stage { position: relative; aspect-ratio: 9 / 16; height: min(100vh, 177.78vw); overflow: hidden; }
      #title { position: absolute; top: 10px; left: 12px; color: #8fa6d8; font-size: 11px; letter-spacing: 0.12em; pointer-events: none; }
      #label { position: absolute; left: 0; right: 0; top: 30px; text-align: center; color: #fff; font-weight: 800; letter-spacing: 0.08em; font-size: 16px; text-shadow: 0 2px 6px #000; pointer-events: none; }
      #bar { position: absolute; left: 6px; right: 6px; bottom: 12px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
      button { font: 700 12px system-ui, sans-serif; letter-spacing: 0.05em; color: #dfe8ff; background: #1a2a52; border: 0; border-bottom: 3px solid #0b1430; border-radius: 8px; padding: 8px 10px; }
      button.on { background: #f8b800; color: #1a1200; border-bottom-color: #9a6f00; }
    </style>
  </head>
  <body>
    <div id="frame">
      <div id="stage">
        <div id="title">PADEL CHAMP · 3D CHARACTER · drag to turn</div>
        <div id="label"></div>
        <div id="bar"></div>
      </div>
    </div>
    <script type="module" src="/src/art/three/charviewer.ts"></script>
  </body>
</html>
