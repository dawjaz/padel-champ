<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Cache-Control" content="no-cache" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#0a0f2e" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <title>PorTres: Padel Career</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0a0f2e;
        overflow: hidden;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #game {
        width: 100vw;
        height: 100vh;
        height: 100dvh;
      }
      /* The game is portrait only: in landscape it is covered by a rotate hint. */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #0a0f2e;
        color: #e8eefc;
        font: 700 18px/1.4 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        text-align: center;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 14px;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      }
      #rotate .ic { width: 44px; height: 72px; border: 4px solid #ffc21f; border-radius: 10px; animation: turn 1.8s ease-in-out infinite; }
      @keyframes turn { 0%, 30% { transform: rotate(-90deg); } 70%, 100% { transform: rotate(0deg); } }
      @media (orientation: landscape) and (pointer: coarse) and (max-height: 700px) {
        #rotate { display: flex; }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate" aria-live="polite"><div class="ic"></div><div id="rotate-text">Rotate your phone<br />Obróć telefon · Gira el móvil</div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
