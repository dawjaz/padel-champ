name: Deploy web build to GitHub Pages

# Publishes the game from `main` (stylized 2D/3D look) at the site root, and (if the branch exists and builds) the
# classic 16-bit version from `style/16bit` under /16bit/ and the three.js prototype from `style/3d` under /3d/
# (open /3d/3d.html). A broken side branch never blocks the main site. A push to `style/3d` redeploys everything.
on:
  push:
    branches: [main, style/3d]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: site
      - id: old_checkout
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: style/16bit
          path: old16
      - id: three_checkout
        uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: style/3d
          path: old3d
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npm run build
        working-directory: site
      - id: old_build
        if: steps.old_checkout.outcome == 'success'
        continue-on-error: true
        working-directory: old16
        run: |
          npm install
          npm test
          npm run build
      - name: Add the 16-bit build under /16bit/
        if: steps.old_build.outcome == 'success'
        run: |
          mkdir -p site/dist/16bit
          cp -r old16/dist/. site/dist/16bit/
      - id: three_build
        if: steps.three_checkout.outcome == 'success'
        continue-on-error: true
        working-directory: old3d
        run: |
          npm install
          npm test
          npm run build
      - name: Add the three.js prototype under /3d/
        if: steps.three_build.outcome == 'success'
        run: |
          mkdir -p site/dist/3d
          cp -r old3d/dist/. site/dist/3d/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
