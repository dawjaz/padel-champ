<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Padel Champ: sound check</title>
<style>body{font:16px system-ui;background:#10202e;color:#eef;margin:12px}h2{margin:18px 0 6px}button{font:inherit;margin:3px;padding:8px 12px;border-radius:8px;border:0;background:#2b6cb0;color:#fff}</style>
<h1>Sound check</h1>
<p>Tap a clip. Each group is one kind of sound in the game. A clip in the wrong group: move its file name to the right list in <code>assets/audio/sfx/manifest.json</code>.</p>
<div id="o"></div>
<script>
fetch('assets/audio/sfx/manifest.json').then(r=>r.json()).then(m=>{
  const o=document.getElementById('o');
  for(const k of Object.keys(m)){
    const h=document.createElement('h2');h.textContent=k+' ('+m[k].length+')';o.appendChild(h);
    for(const f of m[k]){const b=document.createElement('button');b.textContent=f.replace('.wav','');b.onclick=()=>new Audio('assets/audio/sfx/'+f).play();o.appendChild(b);}
  }
});
</script>
